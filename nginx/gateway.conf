# v17 PR #3 — sticky upstream + SSE hardening.
#
# OSS nginx (alpine image) doesn't support runtime DNS refresh
# inside an ``upstream`` block (``server NAME resolve`` is
# nginx-plus-only).  Replicas resolve once at config load + on
# nginx reload.  Container restarts that swap IPs require
# ``docker compose restart gateway`` OR rely on
# ``proxy_next_upstream`` to mask brief 5xx during rolling
# restart.  That is acceptable for the user's single-box, manual-
# scale dev workflow.
#
# ``hash $cookie_amor_session consistent`` binds a client to one
# replica for the lifetime of its session cookie (set by
# ``POST /api/code/start`` in
# ``document_processor/api/code_intelligence_routes.py``).  When
# the cookie is absent (first request, or non-code routes), nginx
# hashes empty — every such request lands on the same replica
# round-robin-ish.  ``consistent`` keeps reshuffling minimal when
# the replica set changes.
#
# Cross-replica fan-out continues to work via Redis Pub/Sub
# (Phase 17 Commit S `_publish` + `cache_manager.publish_event`)
# so SSE survives even when the cookie's pinned replica dies and
# the client reconnects to a different replica.

upstream amor_app {
    hash $cookie_amor_session consistent;
    server app:8000 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver (re-resolve container names)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow larger payloads for uploads/requests
    client_max_body_size 50m;

    # Proxy the main app (FastAPI + UI)
    location / {
        proxy_pass http://amor_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # SSE-specific tuning for Code Intelligence event streams.
    # ``proxy_buffering off`` is critical — without it nginx
    # accumulates response bytes before flushing, breaking real-
    # time SSE.  ``proxy_read_timeout 3600s`` covers long-running
    # debug sessions.  ``proxy_next_upstream error timeout`` only
    # falls back on hard failures, not on 5xx (a 5xx in mid-
    # stream usually means the upstream chose to abort).
    location ~ ^/api/code/[^/]+/events$ {
        proxy_pass http://amor_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream error timeout;
    }

    # Grafana behind /grafana/
    # Grafana must be configured to serve from subpath.
    location /grafana/ {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Prometheus behind /prometheus/
    # Prometheus must be configured with --web.route-prefix=/prometheus
    location /prometheus/ {
        set $upstream_prometheus http://prometheus:9090;
        proxy_pass $upstream_prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
