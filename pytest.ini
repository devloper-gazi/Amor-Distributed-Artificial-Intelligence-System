[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore:networkx\.pagerank_scipy is deprecated.*:DeprecationWarning
    ignore:Field "model_name" has conflict with protected namespace.*:UserWarning
# Make top-level packages reliably importable from any test file.
# `document_processor.*` happens to work because tests previously only
# imported under that one package and pytest's rootdir-prepend kicks
# in. With Phase 1A landing tests under `tests/local_ai/`, we now need
# both `document_processor` and `local_ai` (and any future top-level
# package) findable — listing the repo root as a pythonpath does that
# without forcing an editable install.
pythonpath = .
