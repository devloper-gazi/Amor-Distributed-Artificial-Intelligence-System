<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMOR v2 — build required</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: Canvas;
        color: CanvasText;
      }
      .panel {
        max-width: 32rem;
        margin: 1rem;
        padding: 2rem;
        border: 1px solid color-mix(in oklch, CanvasText 18%, transparent);
        border-radius: 0.75rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.5;
        color: color-mix(in oklch, CanvasText 75%, transparent);
      }
      pre {
        background: color-mix(in oklch, CanvasText 6%, transparent);
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
        font-size: 0.85rem;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>AMOR v2 — build required</h1>
      <p>
        The v2 web UI hasn't been compiled yet.  Run the build inside
        <code>web_ui/v2</code> and reload this page.
      </p>
      <pre>cd web_ui/v2
npm install
npm run build</pre>
      <p>
        Or fall back to the existing v1 UI at
        <a href="/">/</a>.
      </p>
    </div>
  </body>
</html>
