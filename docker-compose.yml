name: amor

services:
  # Single entrypoint for environments that only expose one port.
  # Provides / -> app, /grafana -> grafana, /prometheus -> prometheus.
  gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - grafana
      - prometheus
    networks:
      - docprocessor-network

  # Main application
  app:
    build: .
    # Install any new deps from host requirements.txt on startup so the
    # bind-mounted source tree never drifts from what the image provides.
    # Fast after first boot (pip uses wheel cache); zero-cost when nothing
    # is new.
    command:
      - sh
      - -c
      - "pip install --quiet --root-user-action=ignore -r /app/requirements.txt && exec python -m document_processor.main"
    # NOTE: The app is exposed via the `gateway` service on port 8000.
    # If you want direct access as well, add a port mapping like "8001:8000".
    environment:
      # Service
      - SERVICE_NAME=document-processor
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=documents

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=docdb
      - POSTGRES_USER=docuser
      - POSTGRES_PASSWORD=docpass123

      # MongoDB
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DATABASE=documents

      # API Keys (set these via .env file)
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY}
      - AZURE_TRANSLATOR_KEY=${AZURE_TRANSLATOR_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Ollama Local AI
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_AUTO_PULL=true

      # User-uploaded GGUF custom models (More settings → AI Model →
      # Upload tab). Both the app container *and* the ollama container
      # mount the `custom-models-data` volume at this path so Ollama's
      # /api/create FROM-directive can read the .gguf files the app
      # writes there. Capped at MAX_MODEL_UPLOAD_SIZE_GB to avoid the
      # uploader filling the host disk.
      - CUSTOM_MODELS_DIR=/data/custom_models
      - MAX_MODEL_UPLOAD_SIZE_GB=${MAX_MODEL_UPLOAD_SIZE_GB:-50}

      # NLLB Translation Model
      - NLLB_MODEL_PATH=/models/nllb-200-distilled-600M-ct2
      - NLLB_DEVICE=cuda
      - NLLB_COMPUTE_TYPE=int8_float16

      # FastText Language Detection
      - FASTTEXT_MODEL_PATH=/models/lid.176.bin

      # LanceDB Vector Store
      - LANCEDB_PATH=/data/vectors

      # Code Intelligence Mode (multi-agent local engine)
      - CODE_OLLAMA_BASE_URL=${CODE_OLLAMA_BASE_URL:-http://ollama:11434}
      - CODE_DEFAULT_MODEL=${CODE_DEFAULT_MODEL:-}
      - CODE_SANDBOX_ENABLED=${CODE_SANDBOX_ENABLED:-true}
      - CODE_SANDBOX_TIMEOUT=${CODE_SANDBOX_TIMEOUT:-30}
      - CODE_SANDBOX_MEMORY=${CODE_SANDBOX_MEMORY:-256m}
      - CODE_AUTO_PULL_MODELS=${CODE_AUTO_PULL_MODELS:-true}
      - CODE_MAX_DEBUG_ITERATIONS=${CODE_MAX_DEBUG_ITERATIONS:-3}
      - CODE_SESSION_TTL_SECONDS=${CODE_SESSION_TTL_SECONDS:-7200}
      - CODE_SANDBOX_PREWARM_IMAGES=${CODE_SANDBOX_PREWARM_IMAGES:-python:3.11-slim,node:20-slim}

      # v2 — Autonomous capability discovery + observability
      - CODE_CAPABILITY_DISCOVERY_ENABLED=${CODE_CAPABILITY_DISCOVERY_ENABLED:-true}
      - CODE_CAPABILITY_DISCOVERY_INTERVAL_SECONDS=${CODE_CAPABILITY_DISCOVERY_INTERVAL_SECONDS:-3600}
      - CODE_CAPABILITY_DISCOVERY_MAX_PER_CYCLE=${CODE_CAPABILITY_DISCOVERY_MAX_PER_CYCLE:-3}
      - CODE_LANGFUSE_URL=${CODE_LANGFUSE_URL:-}
      - CODE_LANGFUSE_PUBLIC_KEY=${CODE_LANGFUSE_PUBLIC_KEY:-}
      - CODE_LANGFUSE_SECRET_KEY=${CODE_LANGFUSE_SECRET_KEY:-}

      # Cycle C Sprint 1 — pluggable LLM backend selector.
      # Default empty → fall through to settings.llm_backend (also empty
      # by default Cycle C Sprint 1 Day 1 commit) → fall through to
      # AMOR_LLM_BACKEND env → fall through to "ollama".
      # Set AMOR_LLM_BACKEND=llama-cpp + AMOR_LLM_BACKEND_URL=...
      # in your .env (or override below) to flip to llama-swap.
      - AMOR_LLM_BACKEND=${AMOR_LLM_BACKEND:-}
      - AMOR_LLM_BACKEND_URL=${AMOR_LLM_BACKEND_URL:-}
      # llama-swap probe URL for /api/admin/llm dashboard probes.
      - AMOR_LLAMASWAP_URL=${AMOR_LLAMASWAP_URL:-http://amor-llama-swap:9100}

      # Cycle F Sprint 5 (Wrong #2 fix) — Docker socket proxy is
      # now the DEFAULT.  Sandbox calls route through the
      # tecnativa/docker-socket-proxy allowlist
      # (VERSION+PING+INFO+IMAGES+CONTAINERS+POST+EXEC+VOLUMES) so a
      # compromised app or LLM-generated tool call cannot reach
      # destructive Docker APIs (network create, swarm, system
      # prune, build, configs, etc.).
      #
      # Proven safe by tools/sandbox_proxy_smoke.py: 11/11
      # assertions pass on 2026-05-15 (7 sandbox-required ops
      # allowed, 4 destructive ops denied).
      #
      # Escape hatch: dev hosts that genuinely need raw socket
      # access (e.g. for `docker network inspect` from within the
      # sandbox) can set AMOR_DOCKER_HOST="" in .env to fall back
      # to the bind-mounted unix socket.  When raw access is
      # enabled the sandbox surface widens significantly — only use
      # on trusted hosts.  See docs/sandbox_hardening.md.
      - DOCKER_HOST=${AMOR_DOCKER_HOST-tcp://amor-docker-proxy:2375}
      - AMOR_DOCKER_HOST=${AMOR_DOCKER_HOST-tcp://amor-docker-proxy:2375}

    depends_on:
      ollama:
        condition: service_healthy
      # Cycle F Sprint 1 — llama-swap is now the default inference
      # path.  Wait for /health before app starts so the first
      # request doesn't 502 while the model loads.
      llama-swap:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_started
      mongo:
        condition: service_started
      docker-socket-proxy:
        condition: service_started

    # Cycle F Sprint 1 — Wrong #1 fix: dropped from `replicas: 2` to
    # single replica.  The sticky-cookie nginx setup
    # (`hash $cookie_amor_session consistent`) was the rationale for
    # 2 replicas (per-session stickiness for SSE continuity), but
    # with llama-swap as the inference layer the prefix cache lives
    # in the llama-server process — splitting traffic across FastAPI
    # replicas can no longer help (cross-replica prefix sharing isn't
    # a thing here).  The nginx config still routes via the cookie
    # so re-adding a 2nd replica later remains zero-change.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - ./data:/data/documents
      - ./models:/models:ro
      - lancedb-data:/data/vectors
      # User-uploaded custom GGUF models — written here by the
      # /api/models/upload route, read back by the Ollama container
      # via the same shared volume below. Read-write because the app
      # writes new uploads + sidecar .meta.json files.
      - custom-models-data:/data/custom_models
      # Bind-mount source tree so host edits are immediately live in both
      # replicas — no `docker cp` + restart cycle, no drift between app-1/app-2,
      # and nothing is lost when containers are recreated. Safe for dev;
      # remove these lines to ship a fully self-contained image.
      - ./document_processor:/app/document_processor
      - ./web_ui:/app/web_ui
      # Phase 16 — top-level ``local_ai`` package (llm_backend, vector_store,
      # ollama_client, episodic_memory, agents, …) lives at the repo root
      # alongside ``document_processor``.  Without this mount, every
      # ``from local_ai…`` import inside document_processor blows up with
      # ModuleNotFoundError (the Dockerfile COPYs only document_processor +
      # web_ui).  Mount RW so the in-container Python sees the same
      # package the host tests do.
      - ./local_ai:/app/local_ai
      # Cycle F Sprint 6 (Step 5 fix) — the `tools/` package was not
      # mounted, so `main.py:_register_eval_runners()` failed with
      # ModuleNotFoundError when importing tools.eval.{humaneval_plus,
      # swebench_lite,ragas_lancedb}.  Mount RW so the eval-runner
      # registry actually populates + the v18 launch gate's
      # conditions #2 + #3 become measurable.
      - ./tools:/app/tools
      - ./requirements.txt:/app/requirements.txt:ro
      # Code Intelligence sandbox — gives the app container access to
      # the host Docker daemon so it can spin up ephemeral runner
      # containers (python:3.11-slim, node:20-slim, etc.) for the
      # ExecutionSandbox. Read-only is enough; we only need to
      # `docker run --rm` the runners.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Phase 16.5 Commit K — shared sandbox workdir on a NAMED volume.
      # When the app sits inside a container with the host docker
      # socket bind-mounted, plain bind-mounts don't survive the
      # path translation: the app sees ``/sandbox-shared/...`` but
      # the host daemon (especially Docker Desktop on Windows / WSL2)
      # can't resolve that path.  A named docker volume IS uniformly
      # addressable: the app writes to ``/sandbox-shared/<run_id>/``
      # and the sandbox runner mounts the SAME volume so the file is
      # visible at the same path.
      - amor-sandbox-shared:/sandbox-shared
      # Cycle C Sprint 0 Day 3 — shared baselines + admin-managed data
      # across replicas.  /app/data lives in a named volume so app-1 +
      # app-2 see the same baseline JSON snapshots; without this, the
      # nginx sticky-cookie can route the dashboard to the replica that
      # never wrote anything → "no run yet" empty state on /admin/baselines
      # despite a successful run on the other replica.
      - amor-app-data:/app/data

    # P2.3: Healthcheck so a frozen worker (e.g. Ollama hang, deadlocked
    # event loop) is detected and restarted by Docker rather than
    # silently swallowing requests forever. The /health endpoint already
    # exists in main.py; this just wires Docker's liveness probe to it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read(); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

    networks:
      - docprocessor-network

  # v17 PR #5 — Docker socket proxy.
  #
  # Exposes a whitelisted subset of the Docker Engine API on
  # ``tcp://docker-socket-proxy:2375`` (compose-internal network
  # only).  The app + Code Intelligence sandbox set
  # ``DOCKER_HOST`` to this address instead of bind-mounting
  # ``/var/run/docker.sock`` directly.  A compromised app can
  # then only call the API endpoints we whitelisted (image
  # inspect / pull / container run / exec / kill / rm) — it
  # cannot, for example, mount host filesystems or read /etc/.
  #
  # Whitelist rationale (matches what sandbox.py actually calls):
  #   VERSION=1   — `docker version` probe
  #   PING=1      — health check
  #   INFO=1      — daemon info
  #   IMAGES=1    — `docker image inspect` + `docker pull`
  #   CONTAINERS=1 — list / inspect
  #   POST=1      — container create + start (NB: this is the
  #                 broad write toggle; we further constrain by
  #                 setting the more specific ``EXEC=1``)
  #   EXEC=1      — `docker exec` (future warm-pool path)
  #   VOLUMES=1   — named-volume mounts (amor-sandbox-shared)
  #
  # The ``ALLOW_RESTARTS=0`` default + the absence of the
  # ``BUILD/COMMIT/CONFIGS/NETWORKS/NODES/PLUGINS/SERVICES/
  # SWARM/TASKS`` toggles keeps the API surface as tight as
  # possible while still letting the sandbox spin up runners.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: amor-docker-proxy
    restart: unless-stopped
    environment:
      - VERSION=1
      - PING=1
      - INFO=1
      - IMAGES=1
      - CONTAINERS=1
      - POST=1
      - EXEC=1
      - VOLUMES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docprocessor-network

  # Apache Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - docprocessor-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - docprocessor-network

  # Redis
  redis:
    image: redis:7-alpine
    # P2.2: AOF + periodic RDB snapshot so sessions/tokens survive
    # `docker compose down`. Without these flags + the named volume
    # below, every restart wiped all auth tokens, research sessions,
    # and translation cache.
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - docprocessor-network

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docdb
      POSTGRES_USER: docuser
      POSTGRES_PASSWORD: docpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - docprocessor-network

  # MongoDB
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - docprocessor-network

  # Ollama Local AI Service
  ollama:
    image: ollama/ollama:latest
    container_name: amor-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # v17 PR #1 — keep two 7B models resident in 8 GB VRAM (~7.5
      # GB total at Q4_K_M for deepseek-r1:7b + qwen2.5-coder:7b)
      # so the engine's architect (plan) + editor (implement)
      # phases don't pay an unload/reload tax between iterations.
      # 30m keepalive trades idle VRAM for fewer cold-loads on
      # the user's interactive workflow; revert to 5m if anything
      # else GPU-bound runs alongside.
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama-data:/root/.ollama
      # Shared with the app container so Ollama's /api/create can read
      # GGUF files the app writes during user uploads. Read-only is
      # enough — Ollama only reads the FROM path; copies bytes into
      # its own ollama-data store.
      - custom-models-data:/data/custom_models:ro
    # Cycle B Commit V — expose the host RTX 4060 to ollama.  Without
    # this reservation Docker Desktop / nvidia-container-toolkit blocks
    # ``nvidia.so`` from being mounted into the container; ``ollama ps``
    # reports ``100% CPU`` and a 7B Q4 plan phase takes 2-3 minutes
    # instead of ~10 s.  ``count: all`` with the nvidia driver is the
    # canonical syntax for Compose v3.8+.
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - docprocessor-network

  # Cycle C Sprint 1 — llama-swap with llama.cpp backend.
  #
  # AMOR's pluggable LLMBackend factory (local_ai/llm_backend) routes
  # to this container when AMOR_LLM_BACKEND=llama-cpp (or llama-swap).
  # The OllamaBackend stays in-tree as a flag-flip rollback path —
  # NOT removed in Sprint 1.
  #
  # Profile-gated so the legacy Ollama-only deploy keeps working
  # without llama-swap:
  #     docker compose --profile llamaswap up -d
  # adds this service.  Without --profile, ollama keeps serving and
  # this container never starts.
  #
  # Models live under amor_custom-models-data:/data/custom_models/llamaswap/.
  # Pull them via tools/pull_models.py before starting the service.
  # Cycle F Sprint 1 — promoted from opt-in (`profiles: [llamaswap]`)
  # to default-on.  AMOR's pluggable LLMBackend now defaults to
  # AMOR_LLM_BACKEND=llama-swap via select_kv_quant.py before boot.
  # Rollback: set AMOR_LLM_BACKEND=ollama; this container can stay up.
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cuda
    container_name: amor-llama-swap
    restart: unless-stopped
    ports:
      # Host 9100 is reserved.  Internal access from the app
      # container goes via the docprocessor-network at
      # http://amor-llama-swap:9100/v1/...
      - "9100:9100"
    volumes:
      - ./compose/llama-swap/config.yaml:/etc/llama-swap/config.yaml:ro
      # Mount the GGUFs from the SAME named volume the judge uses
      # so we don't duplicate disk + tools/pull_models.py writes
      # land in one canonical place.  Sprint 1 GGUFs sit under
      # /data/custom_models/llamaswap/.
      - custom-models-data:/models:ro
    command:
      - --config
      - /etc/llama-swap/config.yaml
      - --listen
      - "0.0.0.0:9100"
      - --watch-config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS http://127.0.0.1:9100/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - docprocessor-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.route-prefix=/prometheus'
      - '--web.external-url=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - docprocessor-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:8000/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/crawl-translation-dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - docprocessor-network

volumes:
  postgres-data:
  mongo-data:
  prometheus-data:
  grafana-data:
  ollama-data:
  lancedb-data:
  redis-data:  # P2.2 — durable Redis state across `docker compose down`
  # User-uploaded GGUF custom models (More settings → AI Model →
  # Upload). Shared between app + ollama containers so the daemon can
  # read FROM-paths the app writes. Survives compose down/up.
  custom-models-data:
  # Phase 16.5 Commit K — shared sandbox workdir.  Named volume
  # so the app and per-run sandbox containers see the SAME files
  # at the SAME path regardless of the host OS / WSL2 path
  # translation.  Each sandbox run writes to a per-run subdir and
  # cleans it up afterwards.  ``name:`` pins the on-disk volume
  # name so docker-compose doesn't prefix it with the project name
  # — ExecutionSandbox refers to the volume by this exact tag.
  amor-sandbox-shared:
    name: amor-sandbox-shared
  # Cycle C Sprint 0 Day 3 — shared /app/data across the 2 app
  # replicas (baselines, future training adapters, eval runs).  Without
  # this, sticky-cookie routes /admin/baselines to whichever replica
  # last won → empty-state when the dashboard hits the OTHER replica.
  amor-app-data:
    name: amor-app-data

networks:
  docprocessor-network:
    driver: bridge
